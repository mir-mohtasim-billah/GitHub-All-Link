<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Website Launcher Pro</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.20), transparent 35%),
        #020617;
      color: #ffffff;
      padding: 25px;
    }

    .container {
      max-width: 1150px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .header p {
      color: #cbd5e1;
      font-size: 15px;
    }

    .panel {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
    }

    .auth-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 12px;
      align-items: center;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1.7fr 1fr auto;
      gap: 12px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      outline: none;
      font-size: 15px;
      background: #f8fafc;
      color: #020617;
    }

    button {
      border: none;
      outline: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s;
      white-space: nowrap;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .save-btn {
      background: #22c55e;
      color: white;
    }

    .login-btn {
      background: #2563eb;
      color: white;
    }

    .signup-btn {
      background: #facc15;
      color: #111827;
    }

    .danger-btn {
      background: #ef4444;
      color: white;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.5fr 1fr auto auto auto;
      gap: 12px;
      align-items: center;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .pinned-btn {
      background: #facc15;
      color: #111827;
    }

    .export-btn {
      background: #38bdf8;
      color: #082f49;
    }

    .import-btn {
      background: #a78bfa;
      color: white;
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      transition: 0.2s;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(59, 130, 246, 0.55);
    }

    .pinned-mark {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 18px;
    }

    .card-top {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 13px;
      padding-right: 25px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #22c55e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      flex-shrink: 0;
    }

    .site-title {
      font-size: 18px;
      font-weight: bold;
      word-break: break-word;
    }

    .category {
      display: inline-block;
      font-size: 12px;
      color: #022c22;
      background: #86efac;
      padding: 5px 9px;
      border-radius: 999px;
      margin: 5px 0 10px;
    }

    .url {
      color: #93c5fd;
      font-size: 13px;
      word-break: break-all;
      margin-bottom: 12px;
    }

    .meta {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .card-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .open-btn {
      background: #2563eb;
      color: white;
    }

    .copy-btn {
      background: #64748b;
      color: white;
    }

    .pin-btn {
      background: #facc15;
      color: #111827;
    }

    .edit-btn {
      background: #fb923c;
      color: #111827;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      grid-column: span 2;
    }

    .empty {
      text-align: center;
      color: #cbd5e1;
      font-size: 18px;
      padding: 50px 10px;
    }

    .hidden-file {
      display: none;
    }

    .logged-user {
      color: #cbd5e1;
      line-height: 1.7;
    }

    .mainApp {
      display: none;
    }

    @media (max-width: 850px) {
      .auth-grid,
      .form-grid,
      .controls {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 28px;
      }

      body {
        padding: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      <h1>🚀 Website Launcher Pro</h1>
      <p>Save all your GitHub-hosted websites in one place and open them from any device.</p>
    </div>

    <div class="panel" id="authBox">
      <div class="auth-grid">
        <input type="email" id="emailInput" placeholder="Email address">
        <input type="password" id="passwordInput" placeholder="Password">
        <button class="login-btn" onclick="signIn()">Login</button>
        <button class="signup-btn" onclick="signUp()">Create Account</button>
      </div>
    </div>

    <div class="panel" id="userBox" style="display:none;">
      <div class="logged-user">
        <strong id="userEmail"></strong>
        <br>
        Your links are now saved in Supabase and will appear on any device after login.
      </div>
      <br>
      <button class="danger-btn" onclick="signOut()">Logout</button>
    </div>

    <div class="mainApp" id="mainApp">

      <div class="panel">
        <div class="form-grid">
          <input type="text" id="siteName" placeholder="Website name">
          <input type="text" id="siteLink" placeholder="Website link">
          <input type="text" id="siteCategory" placeholder="Category e.g. Portfolio">
          <button class="save-btn" id="saveBtn" onclick="saveWebsite()">Save Website</button>
        </div>
      </div>

      <div class="panel">
        <div class="stats">
          <span id="totalText">Total: 0</span>
          <span id="pinnedText">Pinned: 0</span>
          <span id="visitedText">Total Opens: 0</span>
        </div>

        <div class="controls">
          <input type="text" id="searchInput" placeholder="Search by name, link, or category..." onkeyup="displayWebsites()">

          <select id="categoryFilter" onchange="displayWebsites()">
            <option value="all">All Categories</option>
          </select>

          <button class="pinned-btn" onclick="openPinned()">Open Pinned</button>
          <button class="export-btn" onclick="exportBackup()">Export Backup</button>
          <button class="import-btn" onclick="document.getElementById('importFile').click()">Import Backup</button>
        </div>

        <input class="hidden-file" type="file" id="importFile" accept=".json" onchange="importBackup(event)">
      </div>

      <div class="links-grid" id="linksContainer"></div>

      <div class="empty" id="emptyText">
        No website saved yet. Add your first website above.
      </div>

      <br>

      <button class="danger-btn" onclick="clearAll()">Clear All Websites</button>

    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://efuphoyrzxnjfagjaded.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Lsc2NwxNGFJlLXM9n34d4g_uD05Li_V";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let websites = [];
    let editIndex = null;

    async function checkUser() {
      const { data, error } = await supabaseClient.auth.getUser();

      if (error) {
        console.log(error.message);
      }

      if (data && data.user) {
        currentUser = data.user;

        document.getElementById("authBox").style.display = "none";
        document.getElementById("userBox").style.display = "block";
        document.getElementById("mainApp").style.display = "block";
        document.getElementById("userEmail").innerText = "Logged in as: " + currentUser.email;

        await loadWebsites();
      } else {
        currentUser = null;
        websites = [];

        document.getElementById("authBox").style.display = "block";
        document.getElementById("userBox").style.display = "none";
        document.getElementById("mainApp").style.display = "none";
      }
    }

    async function signUp() {
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();

      if (email === "" || password === "") {
        alert("Please enter email and password.");
        return;
      }

      const { error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        alert(error.message);
      } else {
        alert("Account created. Now login. If email confirmation is enabled, check your email first.");
      }
    }

    async function signIn() {
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();

      if (email === "" || password === "") {
        alert("Please enter email and password.");
        return;
      }

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert(error.message);
      } else {
        document.getElementById("emailInput").value = "";
        document.getElementById("passwordInput").value = "";
        await checkUser();
      }
    }

    async function signOut() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      websites = [];
      editIndex = null;
      await checkUser();
    }

    async function loadWebsites() {
      const { data, error } = await supabaseClient
        .from("websites")
        .select("*")
        .order("pinned", { ascending: false })
        .order("name", { ascending: true });

      if (error) {
        alert(error.message);
        return;
      }

      websites = data || [];
      displayWebsites();
    }

    async function saveWebsite() {
      if (!currentUser) {
        alert("Please login first.");
        return;
      }

      let name = document.getElementById("siteName").value.trim();
      let link = document.getElementById("siteLink").value.trim();
      let category = document.getElementById("siteCategory").value.trim();

      if (name === "" || link === "") {
        alert("Please enter website name and link.");
        return;
      }

      if (!link.startsWith("http://") && !link.startsWith("https://")) {
        link = "https://" + link;
      }

      if (category === "") {
        category = "General";
      }

      if (editIndex === null) {
        const exists = websites.some(site => site.link === link);

        if (exists) {
          alert("This website link is already saved.");
          return;
        }

        const { error } = await supabaseClient
          .from("websites")
          .insert({
            name: name,
            link: link,
            category: category
          });

        if (error) {
          alert(error.message);
          return;
        }
      } else {
        const siteId = websites[editIndex].id;

        const duplicate = websites.some((site, index) => {
          return site.link === link && index !== editIndex;
        });

        if (duplicate) {
          alert("This website link is already saved.");
          return;
        }

        const { error } = await supabaseClient
          .from("websites")
          .update({
            name: name,
            link: link,
            category: category
          })
          .eq("id", siteId);

        if (error) {
          alert(error.message);
          return;
        }

        editIndex = null;
        document.getElementById("saveBtn").innerText = "Save Website";
      }

      clearInputs();
      await loadWebsites();
    }

    function displayWebsites() {
      const container = document.getElementById("linksContainer");
      const emptyText = document.getElementById("emptyText");
      const searchValue = document.getElementById("searchInput").value.toLowerCase();
      const selectedCategory = document.getElementById("categoryFilter").value;

      container.innerHTML = "";

      updateStats();
      updateCategoryFilter(selectedCategory);

      let filtered = websites.filter(site => {
        const name = (site.name || "").toLowerCase();
        const link = (site.link || "").toLowerCase();
        const category = (site.category || "General").toLowerCase();

        const matchesSearch =
          name.includes(searchValue) ||
          link.includes(searchValue) ||
          category.includes(searchValue);

        const matchesCategory =
          selectedCategory === "all" || site.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      filtered.sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return a.name.localeCompare(b.name);
      });

      if (filtered.length === 0) {
        emptyText.style.display = "block";

        if (websites.length === 0) {
          emptyText.innerText = "No website saved yet. Add your first website above.";
        } else {
          emptyText.innerText = "No matching website found.";
        }

        return;
      }

      emptyText.style.display = "none";

      filtered.forEach(site => {
        const originalIndex = websites.findIndex(item => item.id === site.id);

        const card = document.createElement("div");
        card.className = "card";

        const pinnedMark = document.createElement("div");
        pinnedMark.className = "pinned-mark";
        pinnedMark.innerText = site.pinned ? "📌" : "";
        card.appendChild(pinnedMark);

        const top = document.createElement("div");
        top.className = "card-top";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.innerText = site.name.charAt(0).toUpperCase();

        const title = document.createElement("div");
        title.className = "site-title";
        title.innerText = site.name;

        top.appendChild(avatar);
        top.appendChild(title);

        const category = document.createElement("div");
        category.className = "category";
        category.innerText = site.category || "General";

        const url = document.createElement("div");
        url.className = "url";
        url.innerText = site.link;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = `
          Opens: ${site.visits || 0}<br>
          Last opened: ${site.last_opened ? new Date(site.last_opened).toLocaleString() : "Never"}
        `;

        const buttons = document.createElement("div");
        buttons.className = "card-buttons";

        const openBtn = document.createElement("button");
        openBtn.className = "open-btn";
        openBtn.innerText = "Open";
        openBtn.onclick = function() {
          openWebsite(originalIndex);
        };

        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-btn";
        copyBtn.innerText = "Copy";
        copyBtn.onclick = function() {
          copyLink(originalIndex);
        };

        const pinBtn = document.createElement("button");
        pinBtn.className = "pin-btn";
        pinBtn.innerText = site.pinned ? "Unpin" : "Pin";
        pinBtn.onclick = function() {
          togglePin(originalIndex);
        };

        const editBtn = document.createElement("button");
        editBtn.className = "edit-btn";
        editBtn.innerText = "Edit";
        editBtn.onclick = function() {
          editWebsite(originalIndex);
        };

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.innerText = "Delete";
        deleteBtn.onclick = function() {
          deleteWebsite(originalIndex);
        };

        buttons.appendChild(openBtn);
        buttons.appendChild(copyBtn);
        buttons.appendChild(pinBtn);
        buttons.appendChild(editBtn);
        buttons.appendChild(deleteBtn);

        card.appendChild(top);
        card.appendChild(category);
        card.appendChild(url);
        card.appendChild(meta);
        card.appendChild(buttons);

        container.appendChild(card);
      });
    }

    async function openWebsite(index) {
      const site = websites[index];

      window.open(site.link, "_blank");

      const { error } = await supabaseClient
        .from("websites")
        .update({
          visits: (site.visits || 0) + 1,
          last_opened: new Date().toISOString()
        })
        .eq("id", site.id);

      if (!error) {
        await loadWebsites();
      }
    }

    async function copyLink(index) {
      try {
        await navigator.clipboard.writeText(websites[index].link);
        alert("Link copied.");
      } catch {
        alert("Copy failed. You can manually copy the link.");
      }
    }

    async function togglePin(index) {
      const site = websites[index];

      const { error } = await supabaseClient
        .from("websites")
        .update({
          pinned: !site.pinned
        })
        .eq("id", site.id);

      if (error) {
        alert(error.message);
        return;
      }

      await loadWebsites();
    }

    function editWebsite(index) {
      document.getElementById("siteName").value = websites[index].name;
      document.getElementById("siteLink").value = websites[index].link;
      document.getElementById("siteCategory").value = websites[index].category || "General";

      editIndex = index;
      document.getElementById("saveBtn").innerText = "Update Website";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    async function deleteWebsite(index) {
      if (!confirm("Delete this website?")) return;

      const { error } = await supabaseClient
        .from("websites")
        .delete()
        .eq("id", websites[index].id);

      if (error) {
        alert(error.message);
        return;
      }

      await loadWebsites();
    }

    async function openPinned() {
      const pinnedSites = websites.filter(site => site.pinned);

      if (pinnedSites.length === 0) {
        alert("No pinned websites found.");
        return;
      }

      pinnedSites.forEach(site => {
        window.open(site.link, "_blank");
      });

      for (const site of pinnedSites) {
        await supabaseClient
          .from("websites")
          .update({
            visits: (site.visits || 0) + 1,
            last_opened: new Date().toISOString()
          })
          .eq("id", site.id);
      }

      await loadWebsites();
    }

    function exportBackup() {
      const data = JSON.stringify(websites, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "website-launcher-supabase-backup.json";
      a.click();

      URL.revokeObjectURL(url);
    }

    async function importBackup(event) {
      const file = event.target.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = async function(e) {
        try {
          const importedData = JSON.parse(e.target.result);

          if (!Array.isArray(importedData)) {
            alert("Invalid backup file.");
            return;
          }

          const newItems = [];

          importedData.forEach(site => {
            if (site.name && site.link) {
              const exists = websites.some(item => item.link === site.link);

              if (!exists) {
                newItems.push({
                  name: site.name,
                  link: site.link,
                  category: site.category || "General",
                  pinned: site.pinned || false,
                  visits: site.visits || 0,
                  last_opened: site.last_opened || site.lastOpened || null
                });
              }
            }
          });

          if (newItems.length === 0) {
            alert("No new websites found in backup.");
            return;
          }

          const { error } = await supabaseClient
            .from("websites")
            .insert(newItems);

          if (error) {
            alert(error.message);
            return;
          }

          await loadWebsites();
          alert("Backup imported successfully.");
        } catch {
          alert("Could not import this file.");
        }
      };

      reader.readAsText(file);
    }

    async function clearAll() {
      if (!confirm("Are you sure you want to delete all websites?")) return;

      const { error } = await supabaseClient
        .from("websites")
        .delete()
        .neq("id", "00000000-0000-0000-0000-000000000000");

      if (error) {
        alert(error.message);
        return;
      }

      await loadWebsites();
    }

    function updateStats() {
      const total = websites.length;
      const pinned = websites.filter(site => site.pinned).length;
      const totalVisits = websites.reduce((sum, site) => sum + (site.visits || 0), 0);

      document.getElementById("totalText").innerText = "Total: " + total;
      document.getElementById("pinnedText").innerText = "Pinned: " + pinned;
      document.getElementById("visitedText").innerText = "Total Opens: " + totalVisits;
    }

    function updateCategoryFilter(previousValue) {
      const filter = document.getElementById("categoryFilter");
      const categories = [...new Set(websites.map(site => site.category || "General"))];

      filter.innerHTML = `<option value="all">All Categories</option>`;

      categories.forEach(category => {
        const option = document.createElement("option");
        option.value = category;
        option.innerText = category;
        filter.appendChild(option);
      });

      if (categories.includes(previousValue)) {
        filter.value = previousValue;
      } else {
        filter.value = "all";
      }
    }

    function clearInputs() {
      document.getElementById("siteName").value = "";
      document.getElementById("siteLink").value = "";
      document.getElementById("siteCategory").value = "";
    }

    document.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        const active = document.activeElement.id;

        if (
          active === "siteName" ||
          active === "siteLink" ||
          active === "siteCategory"
        ) {
          saveWebsite();
        }

        if (
          active === "emailInput" ||
          active === "passwordInput"
        ) {
          signIn();
        }
      }
    });

    supabaseClient.auth.onAuthStateChange(function() {
      checkUser();
    });

    checkUser();
  </script>
</body>
</html>
