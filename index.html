<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website Launcher Pro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.20), transparent 35%),
        #020617;
      color: #ffffff;
      padding: 25px;
    }

    .container {
      max-width: 1150px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .header p {
      color: #cbd5e1;
      font-size: 15px;
    }

    .panel {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1.7fr 1fr auto;
      gap: 12px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      outline: none;
      font-size: 15px;
      background: #f8fafc;
      color: #020617;
    }

    button {
      border: none;
      outline: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s;
      white-space: nowrap;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .save-btn {
      background: #22c55e;
      color: white;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.5fr 1fr auto auto auto;
      gap: 12px;
      align-items: center;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .action-btn {
      background: #334155;
      color: white;
    }

    .pinned-btn {
      background: #facc15;
      color: #111827;
    }

    .export-btn {
      background: #38bdf8;
      color: #082f49;
    }

    .import-btn {
      background: #a78bfa;
      color: white;
    }

    .danger-btn {
      background: #ef4444;
      color: white;
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      transition: 0.2s;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(59, 130, 246, 0.55);
    }

    .card-top {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 13px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #22c55e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      flex-shrink: 0;
    }

    .site-title {
      font-size: 18px;
      font-weight: bold;
      word-break: break-word;
    }

    .category {
      display: inline-block;
      font-size: 12px;
      color: #022c22;
      background: #86efac;
      padding: 5px 9px;
      border-radius: 999px;
      margin: 5px 0 10px;
    }

    .url {
      color: #93c5fd;
      font-size: 13px;
      word-break: break-all;
      margin-bottom: 12px;
    }

    .meta {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .card-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .open-btn {
      background: #2563eb;
      color: white;
    }

    .copy-btn {
      background: #64748b;
      color: white;
    }

    .pin-btn {
      background: #facc15;
      color: #111827;
    }

    .edit-btn {
      background: #fb923c;
      color: #111827;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      grid-column: span 2;
    }

    .pinned-mark {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 18px;
    }

    .empty {
      text-align: center;
      color: #cbd5e1;
      font-size: 18px;
      padding: 50px 10px;
    }

    .hidden-file {
      display: none;
    }

    @media (max-width: 850px) {
      .form-grid,
      .controls {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 28px;
      }

      body {
        padding: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      <h1>🚀 Website Launcher Pro</h1>
      <p>One page to save, manage, search, backup, and open all your GitHub-hosted websites.</p>
    </div>

    <div class="panel">
      <div class="form-grid">
        <input type="text" id="siteName" placeholder="Website name">
        <input type="text" id="siteLink" placeholder="Website link">
        <input type="text" id="siteCategory" placeholder="Category e.g. Portfolio">
        <button class="save-btn" id="saveBtn" onclick="saveWebsite()">Save Website</button>
      </div>
    </div>

    <div class="panel">
      <div class="stats">
        <span id="totalText">Total: 0</span>
        <span id="pinnedText">Pinned: 0</span>
        <span id="visitedText">Total Opens: 0</span>
      </div>

      <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by name, link, or category..." onkeyup="displayWebsites()">

        <select id="categoryFilter" onchange="displayWebsites()">
          <option value="all">All Categories</option>
        </select>

        <button class="pinned-btn" onclick="openPinned()">Open Pinned</button>
        <button class="export-btn" onclick="exportBackup()">Export Backup</button>
        <button class="import-btn" onclick="document.getElementById('importFile').click()">Import Backup</button>
      </div>

      <input class="hidden-file" type="file" id="importFile" accept=".json" onchange="importBackup(event)">
    </div>

    <div class="links-grid" id="linksContainer"></div>

    <div class="empty" id="emptyText">
      No website saved yet. Add your first website above.
    </div>

    <br>

    <button class="danger-btn" onclick="clearAll()">Clear All Websites</button>

  </div>

  <script>
    let websites = JSON.parse(localStorage.getItem("proWebsites")) || [];
    let editIndex = null;

    function saveWebsite() {
      let name = document.getElementById("siteName").value.trim();
      let link = document.getElementById("siteLink").value.trim();
      let category = document.getElementById("siteCategory").value.trim();

      if (name === "" || link === "") {
        alert("Please enter website name and link.");
        return;
      }

      if (!link.startsWith("http://") && !link.startsWith("https://")) {
        link = "https://" + link;
      }

      if (category === "") {
        category = "General";
      }

      let duplicate = websites.some((site, index) => site.link === link && index !== editIndex);

      if (duplicate) {
        alert("This website link is already saved.");
        return;
      }

      let data = {
        name: name,
        link: link,
        category: category,
        pinned: editIndex !== null ? websites[editIndex].pinned : false,
        visits: editIndex !== null ? websites[editIndex].visits : 0,
        lastOpened: editIndex !== null ? websites[editIndex].lastOpened : "Never"
      };

      if (editIndex === null) {
        websites.push(data);
      } else {
        websites[editIndex] = data;
        editIndex = null;
        document.getElementById("saveBtn").innerText = "Save Website";
      }

      saveToStorage();
      clearInputs();
      displayWebsites();
    }

    function displayWebsites() {
      let container = document.getElementById("linksContainer");
      let emptyText = document.getElementById("emptyText");
      let searchValue = document.getElementById("searchInput").value.toLowerCase();
      let selectedCategory = document.getElementById("categoryFilter").value;

      container.innerHTML = "";

      updateStats();
      updateCategoryFilter();

      let filtered = websites.filter(site => {
        let matchesSearch =
          site.name.toLowerCase().includes(searchValue) ||
          site.link.toLowerCase().includes(searchValue) ||
          site.category.toLowerCase().includes(searchValue);

        let matchesCategory =
          selectedCategory === "all" || site.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      filtered.sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return a.name.localeCompare(b.name);
      });

      if (filtered.length === 0) {
        emptyText.style.display = "block";
        return;
      }

      emptyText.style.display = "none";

      filtered.forEach(site => {
        let originalIndex = websites.indexOf(site);

        let card = document.createElement("div");
        card.className = "card";

        let pinnedMark = document.createElement("div");
        pinnedMark.className = "pinned-mark";
        pinnedMark.innerText = site.pinned ? "📌" : "";
        card.appendChild(pinnedMark);

        let top = document.createElement("div");
        top.className = "card-top";

        let avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.innerText = site.name.charAt(0).toUpperCase();

        let title = document.createElement("div");
        title.className = "site-title";
        title.innerText = site.name;

        top.appendChild(avatar);
        top.appendChild(title);

        let category = document.createElement("div");
        category.className = "category";
        category.innerText = site.category;

        let url = document.createElement("div");
        url.className = "url";
        url.innerText = site.link;

        let meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = `
          Opens: ${site.visits}<br>
          Last opened: ${site.lastOpened}
        `;

        let buttons = document.createElement("div");
        buttons.className = "card-buttons";

        buttons.innerHTML = `
          <button class="open-btn" onclick="openWebsite(${originalIndex})">Open</button>
          <button class="copy-btn" onclick="copyLink(${originalIndex})">Copy</button>
          <button class="pin-btn" onclick="togglePin(${originalIndex})">${site.pinned ? "Unpin" : "Pin"}</button>
          <button class="edit-btn" onclick="editWebsite(${originalIndex})">Edit</button>
          <button class="delete-btn" onclick="deleteWebsite(${originalIndex})">Delete</button>
        `;

        card.appendChild(top);
        card.appendChild(category);
        card.appendChild(url);
        card.appendChild(meta);
        card.appendChild(buttons);

        container.appendChild(card);
      });
    }

    function openWebsite(index) {
      websites[index].visits++;
      websites[index].lastOpened = new Date().toLocaleString();
      saveToStorage();
      window.open(websites[index].link, "_blank");
      displayWebsites();
    }

    function copyLink(index) {
      navigator.clipboard.writeText(websites[index].link);
      alert("Link copied!");
    }

    function togglePin(index) {
      websites[index].pinned = !websites[index].pinned;
      saveToStorage();
      displayWebsites();
    }

    function editWebsite(index) {
      document.getElementById("siteName").value = websites[index].name;
      document.getElementById("siteLink").value = websites[index].link;
      document.getElementById("siteCategory").value = websites[index].category;

      editIndex = index;
      document.getElementById("saveBtn").innerText = "Update Website";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function deleteWebsite(index) {
      if (confirm("Delete this website?")) {
        websites.splice(index, 1);
        saveToStorage();
        displayWebsites();
      }
    }

    function openPinned() {
      let pinnedSites = websites.filter(site => site.pinned);

      if (pinnedSites.length === 0) {
        alert("No pinned websites found.");
        return;
      }

      pinnedSites.forEach(site => {
        window.open(site.link, "_blank");
      });
    }

    function exportBackup() {
      let data = JSON.stringify(websites, null, 2);
      let blob = new Blob([data], { type: "application/json" });
      let url = URL.createObjectURL(blob);

      let a = document.createElement("a");
      a.href = url;
      a.download = "website-launcher-backup.json";
      a.click();

      URL.revokeObjectURL(url);
    }

    function importBackup(event) {
      let file = event.target.files[0];

      if (!file) return;

      let reader = new FileReader();

      reader.onload = function(e) {
        try {
          let importedData = JSON.parse(e.target.result);

          if (!Array.isArray(importedData)) {
            alert("Invalid backup file.");
            return;
          }

          importedData.forEach(site => {
            if (site.name && site.link) {
              let exists = websites.some(item => item.link === site.link);

              if (!exists) {
                websites.push({
                  name: site.name,
                  link: site.link,
                  category: site.category || "General",
                  pinned: site.pinned || false,
                  visits: site.visits || 0,
                  lastOpened: site.lastOpened || "Never"
                });
              }
            }
          });

          saveToStorage();
          displayWebsites();
          alert("Backup imported successfully.");
        } catch {
          alert("Could not import this file.");
        }
      };

      reader.readAsText(file);
    }

    function clearAll() {
      if (confirm("Are you sure you want to delete all websites?")) {
        websites = [];
        saveToStorage();
        displayWebsites();
      }
    }

    function updateStats() {
      let total = websites.length;
      let pinned = websites.filter(site => site.pinned).length;
      let totalVisits = websites.reduce((sum, site) => sum + site.visits, 0);

      document.getElementById("totalText").innerText = "Total: " + total;
      document.getElementById("pinnedText").innerText = "Pinned: " + pinned;
      document.getElementById("visitedText").innerText = "Total Opens: " + totalVisits;
    }

    function updateCategoryFilter() {
      let filter = document.getElementById("categoryFilter");
      let currentValue = filter.value;

      let categories = [...new Set(websites.map(site => site.category))];

      filter.innerHTML = `<option value="all">All Categories</option>`;

      categories.forEach(category => {
        let option = document.createElement("option");
        option.value = category;
        option.innerText = category;
        filter.appendChild(option);
      });

      filter.value = currentValue;
    }

    function clearInputs() {
      document.getElementById("siteName").value = "";
      document.getElementById("siteLink").value = "";
      document.getElementById("siteCategory").value = "";
    }

    function saveToStorage() {
      localStorage.setItem("proWebsites", JSON.stringify(websites));
    }

    document.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        let active = document.activeElement.id;

        if (
          active === "siteName" ||
          active === "siteLink" ||
          active === "siteCategory"
        ) {
          saveWebsite();
        }
      }
    });

    displayWebsites();
  </script>
</body>
</html>
